<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✨ My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="task-section">

            <div class="list-box">
                <h2>Pending Tasks</h2>
                <p id="pendingCount">0 pending</p>

                <div id="pendingTasks">
                    <p class="empty-message">No pending tasks 🎉</p>
                </div>
            </div>

            <div class="list-box">
                <h2>Completed Tasks</h2>
                <p id="completedCount">0 completed</p>

                <div id="completedTasks">
                    <p class="empty-message">No completed tasks yet.</p>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
